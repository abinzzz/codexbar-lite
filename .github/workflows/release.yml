name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify tag and test
        run: |
          make check
          test "$GITHUB_REF_NAME" = "v$(.build/install/bin/codexbar-lite --version)"
      - run: python3 tools/release.py --repository "$GITHUB_REPOSITORY"
      - name: Publish source release and tap formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
